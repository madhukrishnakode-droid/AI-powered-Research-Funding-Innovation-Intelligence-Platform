<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — InnovateHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-left">
            <a href="index.html" class="brand">
                <span class="brand-logo">IH</span>
                InnovateHub
            </a>
            <h1>Join the Research & Innovation Platform</h1>
            <p>
                Create a free account to discover funding, analyze
                research trends, explore patents, and amplify your
                academic impact with AI-powered intelligence.
            </p>
        </div>

        <div class="auth-right">
            <div class="auth-form">

                <h2>Create Account</h2>
                <p class="subtitle">Start your journey in under a minute</p>

                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="firstName">First Name</label>
                            <input class="form-input" type="text" id="firstName" placeholder="First name">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="lastName">Last Name</label>
                            <input class="form-input" type="text" id="lastName" placeholder="Last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input class="form-input" type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="org">Institution / Organization</label>
                        <input class="form-input" type="text" id="org" placeholder="e.g. University of Innovation">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-input" type="password" id="password" placeholder="Create a password">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="confirm">Confirm Password</label>
                            <input class="form-input" type="password" id="confirm" placeholder="Confirm password">
                        </div>
                    </div>

                    <button class="btn btn-primary btn-block" type="submit">Create Account</button>
                </form>

                <div class="divider">OR</div>

                <button class="btn btn-block google-btn" type="button">Continue with Google</button>

                <p class="auth-footer">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>

            </div>
        </div>

    </div>
</div>

</body>
</html>
